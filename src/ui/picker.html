<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; }
      body { font: 13px -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 12px; background: #1e1e1e; color: #ddd; }
      h2 { font-size: 14px; margin: 0 0 8px; }
      input[type="text"], input[type="password"], select { width: 100%; box-sizing: border-box; padding: 5px; background: #2b2b2b; color: #eee; border: 1px solid #444; border-radius: 4px; }
      #list { height: 180px; overflow-y: auto; border: 1px solid #444; border-radius: 4px; margin: 6px 0; }
      .row { padding: 5px 8px; cursor: pointer; border-bottom: 1px solid #2a2a2a; }
      .row.sel { background: #0a64a4; color: #fff; }
      .row small { color: #999; display: block; }
      .field { margin: 6px 0; }
      label { display: block; margin-bottom: 2px; color: #aaa; }
      .tokenrow { display: flex; gap: 8px; align-items: center; }
      .tokenrow > input { flex: 1; min-width: 0; }
      .tokenrow #token-mask { flex: 1; font-family: ui-monospace, monospace; color: #bbb; overflow: hidden; white-space: nowrap; }
      .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
      button { padding: 6px 14px; border-radius: 4px; border: 1px solid #555; background: #333; color: #eee; cursor: pointer; }
      button.primary { background: #0a64a4; border-color: #0a64a4; }
      button:disabled { opacity: 0.5; cursor: default; }
      a { color: #4ea1e0; }
      .hint { color: #888; font-size: 11px; margin-top: 3px; }
    </style>
  </head>
  <body>
    <h2>Separate with MVSEP</h2>
    <input id="search" type="text" placeholder="Search models…" autocomplete="off" />
    <div id="list"></div>
    <div id="options"></div>
    <div class="field">
      <label>Output format</label>
      <select id="format">
        <option value="1">WAV 16-bit</option>
        <option value="4">WAV 32-bit</option>
        <option value="2">FLAC 16-bit</option>
        <option value="5">FLAC 24-bit</option>
        <option value="0">MP3 320</option>
        <option value="3">M4A</option>
      </select>
    </div>
    <div class="field">
      <label>mvsep API token <span class="hint">(<a href="https://mvsep.com/full_api" target="_blank">get one</a>)</span></label>
      <div id="token-locked" style="display:none">
        <div class="tokenrow">
          <span id="token-mask"></span>
          <button id="replace" type="button">Replace</button>
        </div>
      </div>
      <div id="token-entry" style="display:none">
        <div class="tokenrow">
          <input id="token" type="password" placeholder="paste token" autocomplete="off" />
          <button id="save" type="button" disabled>Save</button>
        </div>
      </div>
      <div id="token-status" class="hint"></div>
    </div>
    <div class="actions">
      <button id="cancel">Cancel</button>
      <button id="separate" class="primary" disabled>Separate</button>
    </div>

    <script>
      const DATA = /*__PICKER_DATA__*/null;
      const algos = (DATA && DATA.algorithms) || [];
      const cfg = (DATA && DATA.config) || { outputFormat: 1 };
      const tokenStatus = (DATA && DATA.tokenStatus) || null;

      let selected = null;
      const listEl = document.getElementById("list");
      const optionsEl = document.getElementById("options");
      const searchEl = document.getElementById("search");
      const tokenEl = document.getElementById("token");
      const lockedEl = document.getElementById("token-locked");
      const entryEl = document.getElementById("token-entry");
      const maskEl = document.getElementById("token-mask");
      const statusEl = document.getElementById("token-status");
      const replaceBtn = document.getElementById("replace");
      const saveBtn = document.getElementById("save");
      const formatEl = document.getElementById("format");
      const separateEl = document.getElementById("separate");

      let savedToken = cfg.apiToken || "";
      let replacing = !savedToken; // no saved token → start in entry mode
      let freshSave = false; // token just saved this session (not yet health-checked)

      formatEl.value = String(cfg.outputFormat != null ? cfg.outputFormat : 1);

      function post(payload) {
        const msg = { method: "close_and_send", params: [JSON.stringify(payload)] };
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.live) {
          window.webkit.messageHandlers.live.postMessage(msg);
        } else if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage(msg);
        }
      }

      function maskToken(t) { return t.length <= 4 ? "••••" : "••••••••" + t.slice(-4); }
      function effectiveToken() { return savedToken && !replacing ? savedToken : tokenEl.value.trim(); }

      function renderTokenUI() {
        const locked = savedToken && !replacing;
        lockedEl.style.display = locked ? "" : "none";
        entryEl.style.display = locked ? "none" : "";
        if (locked) maskEl.textContent = maskToken(savedToken);
        if (locked && freshSave) {
          statusEl.style.color = "#aaa";
          statusEl.textContent = "token saved · validated on next launch";
        } else if (locked && tokenStatus) {
          if (tokenStatus.valid) {
            statusEl.style.color = "#7bc47b";
            statusEl.textContent =
              "✓ token valid" + (tokenStatus.premiumMinutes != null ? " · " + tokenStatus.premiumMinutes + " premium min" : "");
          } else {
            statusEl.style.color = "#e88";
            statusEl.textContent =
              "✗ saved token invalid" + (tokenStatus.message ? " (" + tokenStatus.message + ")" : "") + ". Replace it";
          }
        } else {
          statusEl.textContent = "";
        }
        updateEnabled();
      }

      function renderOptions() {
        optionsEl.innerHTML = "";
        if (!selected) return;
        const saved = cfg.lastModel && cfg.lastModel.renderId === selected.renderId ? cfg.lastModel.options || {} : {};
        for (const f of selected.fields) {
          const wrap = document.createElement("div");
          wrap.className = "field";
          const label = document.createElement("label");
          label.textContent = f.text;
          const sel = document.createElement("select");
          sel.dataset.optName = f.name;
          for (const [key, text] of Object.entries(f.options)) {
            const o = document.createElement("option");
            o.value = key; o.textContent = text; sel.appendChild(o);
          }
          sel.value = saved[f.name] != null ? saved[f.name] : f.defaultKey;
          wrap.appendChild(label); wrap.appendChild(sel); optionsEl.appendChild(wrap);
        }
      }

      function selectAlgo(a, rowEl) {
        selected = a;
        for (const el of listEl.querySelectorAll(".row.sel")) el.classList.remove("sel");
        if (rowEl) rowEl.classList.add("sel");
        renderOptions();
        updateEnabled();
      }

      function renderList(filter) {
        listEl.innerHTML = "";
        const q = (filter || "").toLowerCase();
        for (const a of algos) {
          if (q && !(a.name.toLowerCase().includes(q) || a.description.toLowerCase().includes(q))) continue;
          const row = document.createElement("div");
          row.className = "row";
          row.innerHTML = "<span>" + escapeHtml(a.name) + "</span><small>" + escapeHtml(a.description || "") + "</small>";
          row.onclick = () => selectAlgo(a, row);
          if (selected && selected.renderId === a.renderId) row.classList.add("sel");
          listEl.appendChild(row);
        }
      }

      function escapeHtml(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

      function updateEnabled() {
        separateEl.disabled = !(selected && effectiveToken());
        saveBtn.disabled = !tokenEl.value.trim();
      }

      function collectOptions() {
        const out = {};
        for (const sel of optionsEl.querySelectorAll("select[data-opt-name]")) out[sel.dataset.optName] = sel.value;
        return out;
      }

      searchEl.oninput = () => renderList(searchEl.value);
      tokenEl.oninput = updateEnabled;
      replaceBtn.onclick = () => { replacing = true; freshSave = false; tokenEl.value = ""; renderTokenUI(); tokenEl.focus(); };
      saveBtn.onclick = async () => {
        const t = tokenEl.value.trim();
        if (!t) return;
        savedToken = t;
        replacing = false;
        freshSave = true;
        renderTokenUI();
        // Validate immediately. Best-effort: the webview may be blocked by CORS,
        // in which case we fall back to validating on the next launch (node side).
        statusEl.style.color = "#aaa";
        statusEl.textContent = "checking token…";
        try {
          const res = await fetch("https://mvsep.com/api/app/user?api_token=" + encodeURIComponent(t));
          const j = await res.json();
          if (!res.ok || (j && j.success === false)) {
            statusEl.style.color = "#e88";
            statusEl.textContent = "✗ token invalid" + (j && j.data && j.data.message ? " (" + j.data.message + ")" : "");
          } else {
            const d = (j && j.data) || j || {};
            statusEl.style.color = "#7bc47b";
            statusEl.textContent = "✓ token valid" + (d.premium_minutes != null ? " · " + d.premium_minutes + " premium min" : "");
          }
        } catch (e) {
          statusEl.style.color = "#aaa";
          statusEl.textContent = "token saved · validates on next launch";
        }
      };
      document.getElementById("cancel").onclick = () => post({ cancelled: true });
      separateEl.onclick = () =>
        post({
          renderId: selected.renderId,
          options: collectOptions(),
          outputFormat: Number(formatEl.value),
          apiToken: effectiveToken(),
        });

      // Preselect last-used model if present.
      if (cfg.lastModel) {
        const last = algos.find((a) => a.renderId === cfg.lastModel.renderId);
        if (last) selected = last;
      }
      renderList("");
      renderOptions();
      renderTokenUI();
    </script>
  </body>
</html>
